name: Hostel public release acceptance

on:
  pull_request:
    paths:
      - 'scripts/verify-public-launch.mjs'
      - 'scripts/test-public-launch.mjs'
      - '.github/workflows/hostel-public-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Isolated read-only acceptance contract tests
        run: node --test scripts/test-public-launch.mjs

  production-public-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: isolated-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Public production GET checks (no tokens or writes)
        run: node scripts/verify-public-launch.mjs https://mmambugua.studentshostels.com 'MMAMBUGUA HOSTEL'
